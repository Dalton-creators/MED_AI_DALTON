<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="MED AI DALTON — plataforma personal de entrenamiento médico con IA.">
  <title>MED AI DALTON</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="toast-root" aria-live="polite"></div>

  <section id="auth-screen" class="auth-screen">
    <div class="auth-backdrop"></div>
    <div class="auth-card">
      <div class="brand-lockup">
        <div class="brand-mark">M+</div>
        <div>
          <h1>MED AI DALTON</h1>
          <p>Entrenamiento médico inteligente</p>
        </div>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth-tab="login">Iniciar sesión</button>
        <button class="auth-tab" data-auth-tab="register">Crear cuenta</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Correo electrónico<input id="login-email" type="email" autocomplete="email" required></label>
        <label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="primary-btn wide" type="submit">ENTRAR A MED AI</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Nombre<input id="register-name" type="text" autocomplete="name" maxlength="120" required></label>
        <label>Correo electrónico<input id="register-email" type="email" autocomplete="email" required></label>
        <label>Contraseña<input id="register-password" type="password" autocomplete="new-password" minlength="10" required></label>
        <small>Utiliza al menos 10 caracteres.</small>
        <button class="primary-btn wide" type="submit">CREAR MI PERFIL MÉDICO</button>
      </form>
      <div id="auth-message" class="auth-message"></div>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">M+</div>
        <div><strong>MED AI</strong><span>DALTON</span></div>
      </div>

      <nav id="main-nav" class="main-nav">
        <button data-view="dashboard" class="nav-item active"><span>⌂</span>Inicio</button>
        <button data-view="study" class="nav-item"><span>▤</span>Estudiar</button>
        <button data-view="tutor" class="nav-item"><span>✦</span>Tutor IA</button>
        <button data-view="exams" class="nav-item"><span>✓</span>Exámenes</button>
        <button data-view="flashcards" class="nav-item"><span>▱</span>Flashcards</button>
        <button data-view="patient" class="nav-item"><span>♙</span>Paciente virtual</button>
        <button data-view="grand_rounds" class="nav-item"><span>◆</span>Grand Rounds</button>
        <button data-view="emergency" class="nav-item"><span>⚡</span>Emergencias</button>
        <button data-view="ecg" class="nav-item"><span>⌁</span>ECG</button>
        <button data-view="radiology" class="nav-item"><span>◫</span>Radiología</button>
        <button data-view="laboratory" class="nav-item"><span>⚗</span>Laboratorios</button>
        <button data-view="pharmacology" class="nav-item"><span>✚</span>Farmacología</button>
        <button data-view="osce" class="nav-item"><span>◎</span>OSCE</button>
        <button data-view="library" class="nav-item"><span>▥</span>Biblioteca</button>
        <button data-view="mistakes" class="nav-item"><span>!</span>Errores</button>
        <button data-view="plan" class="nav-item"><span>□</span>Plan de estudio</button>
        <button data-view="stats" class="nav-item"><span>⌇</span>Estadísticas</button>
        <button data-view="profile" class="nav-item"><span>○</span>Perfil</button>
      </nav>

      <div class="sidebar-bottom">
        <button id="install-btn" class="ghost-btn hidden">Instalar aplicación</button>
        <button id="logout-btn" class="ghost-btn">Cerrar sesión</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn mobile-only">☰</button>
        <div class="global-search">
          <span>⌕</span><input id="global-search" placeholder="Buscar tema, lección o apunte...">
          <div id="search-results" class="search-results hidden"></div>
        </div>
        <div class="top-actions">
          <span id="sync-badge" class="sync-badge">● Sincronizado</span>
          <button id="quick-study" class="primary-btn">Estudiar ahora</button>
          <button id="user-chip" class="user-chip">D</button>
        </div>
      </header>

      <section id="view-root" class="view-root"></section>
    </main>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
